# =============================================================================
# categories.yaml — briefing categories + client/competitor watchlist.
#
# Each category maps to one of the 8 newsletter sections (see `section`) and
# carries keyword hints used to route/boost items during scoring.
# Add clients under `watchlist` so their brand mentions get an extra boost.
# =============================================================================

# Which newsletter section each category feeds into.
# sections: advertising | strategy | world | malaysia | client_category | ai | sports | day_ahead
