# -----------------------------------------------------------------------------
# Client / competitor watchlist. Brand mentions get a scoring boost and are
# tagged with the client so the "Client category watch" section can flag
# "which client this may affect".
# Edit freely — add real client names.
# -----------------------------------------------------------------------------
watchlist:
  - client: "Automotive client"
    category: automotive
    brands: [Proton, Perodua, Toyota, Honda, BYD, Tesla]
    competitors: [Mazda, Nissan, Chery]
  - client: "Energy / petrol client"
    category: petrol_retail
    brands: [Petronas, Shell, BHPetrol, Caltex]
    competitors: [Petron]
  - client: "FMCG client"
    category: fmcg
    brands: [Nestle, Unilever, Mondelez]
    competitors: [Procter & Gamble]
  - client: "Telco client"
    category: telecommunications
    brands: [Maxis, CelcomDigi, U Mobile]
    competitors: ["YES", unifi]   # quote "YES": bare YES is a YAML boolean (true)
  - client: "Bank client"
    category: banking_and_finance
    brands: [Maybank, CIMB, RHB, Public Bank]
    competitors: [Hong Leong, AmBank]
