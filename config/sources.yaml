# =============================================================================
# sources.yaml — the ONLY place sources live. Never hardcode sources in code.
#
# Edit this file to add / remove / pause / prioritise / categorise sources.
# Validate any time with:  brief sources validate
#
# Fields (per source):
#   name         : human label (required, unique)
#   type         : rss | website | newsletter | api | gmail_search | manual |
#                  youtube | podcast | social            (required)
#   category     : one of the keys in categories.yaml     (required)
#   region       : global | asia | malaysia | mixed | us | uk | ...
#   url          : feed/page URL              (required for rss/website/etc.)
#   query        : search string              (required for gmail_search/api)
#   priority     : 1-10  — higher = more weight in scoring
#   reliability  : 1-10  — low reliability items need a second source to rank
#   frequency    : daily | hourly | weekly    (hint only; informational)
#   tags         : list of topic tags (used for calendar/gmail relevance boost)
#   active       : true | false — false means "skip entirely"
#   notes        : why this source matters
#
# NOTE: URLs left as "ADD_..._HERE" are placeholders. The validator will WARN
# (not fail) on them and the collector skips them. Fill them in as you go.
# =============================================================================

