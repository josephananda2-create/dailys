# =============================================================================
# sources.yaml — the ONLY place sources live. Never hardcode sources in code.
#
# Edit freely: add / remove / pause / prioritise / categorise. Validate with:
#   brief sources validate
#
# Fields: name, type, category, region, url|query, priority (1-10),
#         reliability (1-10), frequency, tags, active, notes
#
# Only well-known, reliable public RSS feeds are used below. Paywalled sources
# (WARC, FT, Economist) have no usable free feed and are left paused; fill in a
# feed URL and flip active:true if you have access.
# =============================================================================

